name: "Auto Create Branch from Issue"

on:
  issues:
    types: [opened, reopened]

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Extract branch info
        id: branch_info
        run: |
          ISSUE_NUM=${{ github.event.issue.number }}
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_LABELS="${{ join(github.event.issue.labels.*.name) }}"
          
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | \
            sed 's/^\[.*\] *//' | \
            sed 's/[0-9]\+\.[0-9]\+\.[0-9]\+ *- *//' | \
            sed 's/^ *//; s/ *$//')
          
          # Convert to kebab-case: first transliterate accents, then strip remaining non-ASCII
          SLUG=$(echo "$CLEAN_TITLE" | \
            sed 's/[àáâãä]/a/g; s/[èéêë]/e/g; s/[ìíîï]/i/g; s/[òóôõö]/o/g; s/[ùúûü]/u/g; s/[ç]/c/g; s/[ñ]/n/g' | \
            sed 's/[^\x00-\x7F]//g' | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/[^a-z0-9]/-/g' | \
            sed 's/-\+/-/g' | \
            sed 's/^-\|-$//')
          
          # Include issue number in branch: number-slug
          BRANCH_NAME="${ISSUE_NUM}-${SLUG}"

          # Determine type based on labels
          TYPE="feature"

          # type:story → branch pai, usa package/
          if [[ "$ISSUE_LABELS" =~ type:story ]]; then
            TYPE="package"
          elif [[ "$ISSUE_LABELS" =~ type:bug ]]; then
            TYPE="bugfix"
          elif [[ "$ISSUE_LABELS" =~ type:hotfix ]] || [[ "$ISSUE_LABELS" == *"urgent"* ]]; then
            TYPE="hotfix"
          elif [[ "$ISSUE_LABELS" =~ type:documentation ]]; then
            TYPE="docs"
          elif [[ "$ISSUE_LABELS" =~ type:research ]]; then
            TYPE="research"
          elif [[ "$ISSUE_LABELS" =~ type:feature ]]; then
            TYPE="feature"
          # Fallback labels para compatibilidade
          elif [[ "$ISSUE_LABELS" == *"bugfix"* ]]; then
            TYPE="bugfix"
          elif [[ "$ISSUE_LABELS" == *"docs"* ]]; then
            TYPE="docs"
          elif [[ "$ISSUE_LABELS" == *"research"* ]]; then
            TYPE="research"
          elif [[ "$ISSUE_LABELS" == *"refactor"* ]]; then
            TYPE="refactor"
          elif [[ "$ISSUE_LABELS" == *"perf"* ]]; then
            TYPE="perf"
          elif [[ "$ISSUE_LABELS" == *"test"* ]]; then
            TYPE="test"
          elif [[ "$ISSUE_LABELS" == *"chore"* ]]; then
            TYPE="chore"
          fi
                    
          FULL_BRANCH_NAME="${TYPE}/${BRANCH_NAME}"
          
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "branch=$FULL_BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "issue_num=$ISSUE_NUM" >> $GITHUB_OUTPUT
          
          echo "📌 Branch to create: $FULL_BRANCH_NAME"
          echo "📝 Type: $TYPE"
          echo "🔢 Issue: #$ISSUE_NUM"
          echo "🏷️  Labels: $ISSUE_LABELS"

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = '${{ steps.branch_info.outputs.branch }}';
            const issueNum = ${{ steps.branch_info.outputs.issue_num }};
            const branchType = '${{ steps.branch_info.outputs.type }}';
                        
            const typeEmojis = {
              'package':  '📦',
              'feature':  '✨',
              'bugfix':   '🐛',
              'hotfix':   '🚨',
              'docs':     '📚',
              'research': '🔬',
              'refactor': '♻️',
              'perf':     '⚡',
              'test':     '🧪',
              'chore':    '🔧'
            };
            
            const emoji = typeEmojis[branchType] || '🌳';
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `# ${emoji} Branch Sugerida\n\nCrie a branch localmente com os comandos abaixo:\n\n\`\`\`bash\ngit checkout -b ${branchName}\ngit push -u origin ${branchName}\n\`\`\`\n\n**Pattern:** \`<type>/<number>-<kebab-case-description>\`\n**Type:** \`${branchType}\`\n**Branch:** \`${branchName}\`\n**Issue:** #${issueNum}`
            });