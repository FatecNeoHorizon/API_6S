name: "Auto-Fill PR from Branch"

on:
  pull_request:
    types: [opened, reopened]

jobs:
  extract-issue-and-update-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: Extract issue number from branch
        id: extract
        run: |
          # Branch format: type/123-description
          BRANCH_NAME="${{ github.head_ref }}"
          
          # Extract number (first number after the slash)
          ISSUE_NUM=$(echo "$BRANCH_NAME" | grep -oP '(?<=/)\d+' | head -1)
          
          # Extract type
          TYPE=$(echo "$BRANCH_NAME" | cut -d'/' -f1)
          
          # If number not found, try alternative
          if [ -z "$ISSUE_NUM" ]; then
            ISSUE_NUM=$(echo "$BRANCH_NAME" | grep -oP '^\d+' | head -1)
          fi
          
          echo "issue_num=$ISSUE_NUM" >> $GITHUB_OUTPUT
          echo "branch_type=$TYPE" >> $GITHUB_OUTPUT
          
          echo "📌 Branch: $BRANCH_NAME"
          echo "🔢 Issue: #$ISSUE_NUM"
          echo "📦 Type: $TYPE"

      - name: Update PR body with traceability and close link
        if: steps.extract.outputs.issue_num != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueNum = '${{ steps.extract.outputs.issue_num }}';
            const branchType = '${{ steps.extract.outputs.branch_type }}';
            const branchName = '${{ github.head_ref }}';
            const prNumber = context.issue.number;

            const typeEmojis = {
              'package':  '📦',
              'feature':  '✨',
              'bugfix':   '🐛',
              'hotfix':   '🚨',
              'docs':     '📚',
              'research': '🔬',
              'refactor': '♻️',
              'perf':     '⚡',
              'test':     '🧪',
              'chore':    '🔧'
            };

            const emoji = typeEmojis[branchType] || '🌳';

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            let body = pr.data.body || '';

            // Replace empty "Closes #" from template, or append if not present
            if (!body.includes(`Closes #${issueNum}`)) {
              if (body.includes('Closes #')) {
                body = body.replace('Closes #', `Closes #${issueNum}`);
              } else {
                body += `\n\nCloses #${issueNum}`;
              }
            }

            // Add traceability block to body if not already present
            if (!body.includes('Traceability')) {
              body += `\n\n<details>\n<summary>${emoji} Traceability</summary>\n\n**Issue:** #${issueNum}\n**Type:** \`${branchType}\`\n**Branch:** \`${branchName}\`\n\n</details>`;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: body
            });

            console.log(`✅ PR #${prNumber} updated: Closes #${issueNum}, traceability added`);